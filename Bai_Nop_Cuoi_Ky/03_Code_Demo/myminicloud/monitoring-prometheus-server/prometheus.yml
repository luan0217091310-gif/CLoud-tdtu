global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['monitoring-node-exporter-server:9100']

  - job_name: 'web'
    static_configs:
      - targets: ['web-frontend-server:80']


  - job_name: 'web-nginx-exporter'
    static_configs:
      - targets: ['monitoring-nginx-exporter-server:9113']
