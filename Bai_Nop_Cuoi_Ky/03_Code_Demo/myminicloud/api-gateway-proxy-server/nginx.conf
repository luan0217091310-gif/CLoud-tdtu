events {}

http {
  # Docker cung cấp địa chỉ dịch vụ qua DNS nội bộ.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream web_cluster {
    zone web_cluster 64k;
    server web-frontend-server:80 resolve;
    server web-frontend-server2:80 resolve;
  }

  upstream backend {
    zone backend 64k;
    server application-backend-server:8081 resolve;
  }

  upstream keycloak {
    zone keycloak 64k;
    server authentication-identity-server:8080 resolve;
  }

  server {
    listen 80;
    absolute_redirect off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
      proxy_pass http://web_cluster;
    }

    location /api/ {
      proxy_pass http://backend/;
    }

    location = /student {
      proxy_pass http://backend/student;
    }

    location = /student/ {
      proxy_pass http://backend/student;
    }

    location = /auth {
      return 308 /auth/;
    }

    location /auth/ {
      proxy_pass http://keycloak/auth/;
    }
  }
}
