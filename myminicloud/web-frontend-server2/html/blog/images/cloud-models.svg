<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="100%" height="260">
  <rect width="700" height="260" rx="12" fill="#f0f9ff"/>
  <text x="350" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Mô Hình Dịch Vụ Điện Toán Đám Mây (IaaS - PaaS - SaaS)</text>
  <rect x="40" y="60" width="180" height="170" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">IaaS (Hạ tầng)</text>
  <text x="130" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e3a8a">• Amazon EC2, S3</text>
  <text x="130" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e3a8a">• Docker Network</text>
  <text x="130" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e3a8a">• MinIO Storage</text>
  <text x="130" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e3a8a">• Bind9 Internal DNS</text>
  <rect x="260" y="60" width="180" height="170" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#166534">PaaS (Nền tảng)</text>
  <text x="350" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#14532d">• Elastic Beanstalk</text>
  <text x="350" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#14532d">• Flask Backend API</text>
  <text x="350" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#14532d">• MariaDB (RDS)</text>
  <text x="350" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#14532d">• Keycloak (IDaaS)</text>
  <rect x="480" y="60" width="180" height="170" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="570" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400e">SaaS (Phần mềm)</text>
  <text x="570" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#78350f">• Dropbox, CRM</text>
  <text x="570" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#78350f">• WordPress / Web Blog</text>
  <text x="570" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#78350f">• Grafana Dashboard</text>
  <text x="570" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#78350f">• MinIO Web Console</text>
</svg>
