networks:
  cloud-net:
    name: cloud-net
    driver: bridge

services:
  # 1. Web Frontend Server 1 (Nginx tĩnh)
  web-frontend-server:
    build: ./web-frontend-server
    image: myminicloud/web:latest
    container_name: web-frontend-server
    ports:
      - "8080:80"
    networks:
      cloud-net:
        aliases:
          - web
          - web-server
          - web-frontend-server1
    restart: unless-stopped

  # 1b. Web Frontend Server 2 (Replica phục vụ Load Balancing Round Robin - Mở rộng 10)
  web-frontend-server2:
    build: ./web-frontend-server2
    image: myminicloud/web2:latest
    container_name: web-frontend-server2
    ports:
      - "8082:80"
    networks:
      cloud-net:
        aliases:
          - web2
    restart: unless-stopped

  # 2. Application Backend Server (Flask REST API + OIDC + MariaDB)
  application-backend-server:
    build: ./application-backend-server
    image: myminicloud/app:latest
    container_name: application-backend-server
    ports:
      - "8085:8081"
    environment:
      KEYCLOAK_INTERNAL_URL: "http://authentication-identity-server:8080"
      OIDC_ISSUER: "http://authentication-identity-server:8080/realms/master"
      OIDC_AUDIENCE: "myapp"
      DB_HOST: "relational-database-server"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "root"
      DB_NAME: "studentdb"
    depends_on:
      - relational-database-server
    networks:
      cloud-net:
        aliases:
          - app
          - app-server
          - app-backend
    restart: unless-stopped

  # 3. Relational Database Server (MariaDB 11)
  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minicloud
    volumes:
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    networks:
      cloud-net:
        aliases:
          - db
          - mariadb
          - mysql
    restart: unless-stopped

  # 4. Authentication & Identity Server (Keycloak OIDC)
  authentication-identity-server:
    image: quay.io/keycloak/keycloak:latest
    container_name: authentication-identity-server
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./authentication-identity-server/realm_sv001.json:/opt/keycloak/data/import/realm_sv001.json:ro
    ports:
      - "8081:8080"
    networks:
      cloud-net:
        aliases:
          - keycloak
          - auth
          - auth-server
    restart: unless-stopped

  # 5. Object Storage Server (MinIO S3 Compatible)
  object-storage-server:
    image: minio/minio:latest
    container_name: object-storage-server
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./object-storage-server/data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      cloud-net:
        aliases:
          - minio
          - storage
    restart: unless-stopped

  # 6. Internal DNS Server (Bind9)
  internal-dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: internal-dns-server
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    volumes:
      - ./internal-dns-server/named.conf.options:/etc/bind/named.conf.options:ro
      - ./internal-dns-server/named.conf.local:/etc/bind/named.conf.local:ro
      - ./internal-dns-server/db.cloud.local:/etc/bind/db.cloud.local:ro
    networks:
      cloud-net:
        aliases:
          - dns
          - dns-server
          - bind9
    restart: unless-stopped

  # 7a. Monitoring Node Exporter Server
  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter-server
    ports:
      - "9100:9100"
    networks:
      cloud-net:
        aliases:
          - node-exporter
    restart: unless-stopped

  # 7b. Monitoring Prometheus Server
  monitoring-prometheus-server:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus-server
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      cloud-net:
        aliases:
          - prometheus
    restart: unless-stopped

  # 8. Monitoring Grafana Dashboard Server
  monitoring-grafana-dashboard-server:
    image: grafana/grafana:latest
    container_name: monitoring-grafana-dashboard-server
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring-grafana-dashboard-server/provisioning:/etc/grafana/provisioning:ro
    networks:
      cloud-net:
        aliases:
          - grafana
    restart: unless-stopped

  # 9. API Gateway / Reverse Proxy & Load Balancer Server (Nginx)
  api-gateway-proxy-server:
    image: nginx:stable
    container_name: api-gateway-proxy-server
    depends_on:
      - web-frontend-server
      - web-frontend-server2
      - application-backend-server
      - authentication-identity-server
    ports:
      - "80:80"
    volumes:
      - ./api-gateway-proxy-server/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      cloud-net:
        aliases:
          - proxy
          - gateway
    restart: unless-stopped

